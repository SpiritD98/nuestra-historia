<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Meses Juntos - Brenda & Daniel</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.2/photoswipe.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="intro-overlay">
        <!-- 1. FONDO QUE SE DESENFOCARÁ (Agrupamos el título original y las fotos) -->
        <div id="fondo-borroso" class="bloque-borroso">
            <h1 class="anniversary-title" id="titulo-portada">¡Feliz <span id="meses-intro"></span> Mes, Nubecita! <i class="bi bi-hearts"></i></h1>
            <div class="collage-grid" id="collage-fotos">
                <div class="photo-frame" style="--r: -5; animation-delay: 0.1s;"><img src="img/diaFloresAmarillas.jpg" alt="Helados" loading="lazy"></div>
                <div class="photo-frame" style="--r: 4; animation-delay: 0.3s;"><img src="img/elDiaQTeConociFlores.jpg" alt="Beso" loading="lazy"></div>
                <div class="photo-frame" style="--r: -3; animation-delay: 0.5s;"><img src="img/elAnilloYRamoNovios.jpg" alt="Manos" loading="lazy"></div>
                <div class="photo-frame" style="--r: 6; animation-delay: 0.7s;"><img src="img/primerMesversario.jpg" alt="Pastel" loading="lazy"></div>
                <div class="photo-frame" style="--r: -4; animation-delay: 0.9s;"><img src="img/sanValentin1.jpg" alt="Nosotros" loading="lazy"></div>
                <div class="photo-frame" style="--r: 2; animation-delay: 1.1s;"><img src="img/ramoSegundoMV.jpg" alt="Corazón" loading="lazy"></div>
            </div>
        </div>

        <!-- 2. CONTENEDOR DEL JUEGO (Lo que se ve nítido al frente) -->
        <div id="juego-flores-container">
            
            <!-- NUEVO: Título de bienvenida del juego -->
            <h2 id="titulo-juego">Un detalle para ti 🌸</h2>
            <p id="instruccion-teclado">Escribe tu apodo para crear tu ramo~</p>

            <div id="display-palabra"></div>
            
            <!-- LA CARTA (Oculta) -->
            <div id="carta-secreta" class="oculta">
                <div class="lineas-papel">
                    <p id="texto-maquina"></p>
                </div>
                <button class="enter-btn hidden" id="enter-btn" onclick="startExperience()">
                    Nuestra Historia <i class="bi bi-heart-fill"></i>
                </button>
            </div>

            <!-- EL RAMO CENTRAL -->
            <div id="ramo-creativo">
                <img src="img/ramoAtras.png" id="papel-atras" alt="Fondo del envoltorio">
                <div id="flores-generadas"></div>
                <img src="img/ramoFrente.png" id="papel-frente" alt="frente del envoltorio">
            </div>

            <!-- EL TECLADO VIRTUAL -->
            <div id="teclado-virtual">
                <div class="fila-teclado">
                    <button class="tecla" onclick="presionarTecla('Q')">Q</button>
                    <button class="tecla" onclick="presionarTecla('W')">W</button>
                    <button class="tecla" onclick="presionarTecla('E')">E</button>
                    <button class="tecla" onclick="presionarTecla('R')">R</button>
                    <button class="tecla" onclick="presionarTecla('T')">T</button>
                    <button class="tecla" onclick="presionarTecla('Y')">Y</button>
                    <button class="tecla" onclick="presionarTecla('U')">U</button>
                    <button class="tecla" onclick="presionarTecla('I')">I</button>
                    <button class="tecla" onclick="presionarTecla('O')">O</button>
                    <button class="tecla" onclick="presionarTecla('P')">P</button>
                </div>
                <div class="fila-teclado">
                    <button class="tecla" onclick="presionarTecla('A')">A</button>
                    <button class="tecla" onclick="presionarTecla('S')">S</button>
                    <button class="tecla" onclick="presionarTecla('D')">D</button>
                    <button class="tecla" onclick="presionarTecla('F')">F</button>
                    <button class="tecla" onclick="presionarTecla('G')">G</button>
                    <button class="tecla" onclick="presionarTecla('H')">H</button>
                    <button class="tecla" onclick="presionarTecla('J')">J</button>
                    <button class="tecla" onclick="presionarTecla('K')">K</button>
                    <button class="tecla" onclick="presionarTecla('L')">L</button>
                </div>
                <div class="fila-teclado">
                    <button class="tecla tecla-accion" onclick="borrarLetra()"><i class="bi bi-backspace-fill"></i></button>
                    <button class="tecla" onclick="presionarTecla('Z')">Z</button>
                    <button class="tecla" onclick="presionarTecla('X')">X</button>
                    <button class="tecla" onclick="presionarTecla('C')">C</button>
                    <button class="tecla" onclick="presionarTecla('V')">V</button>
                    <button class="tecla" onclick="presionarTecla('B')">B</button>
                    <button class="tecla" onclick="presionarTecla('N')">N</button>
                    <button class="tecla" onclick="presionarTecla('M')">M</button>
                    <button class="tecla tecla-ok" onclick="confirmarRamo()">OK</button>
                </div>
            </div>
        </div>
    </div>

    <main class="main-content" id="main-story"> 
        <header class="hero">
            <h1 id="tituloHistoria"></h1>
            <div class="stats-container">
                <p id="contador-principal">Calculando nuestra historia...</p>
                <div class="detailed-stats">
                    <div class="stat-item">
                        <span class="label">Semanas:</span>
                        <span id="stat-semanas" class="value">0.00</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">Meses:</span>
                        <span id="stat-meses" class="value">0.00</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">Años:</span>
                        <span id="stat-años" class="value">0.00</span>
                    </div>
                </div>
                <div class="countdown-container">
                    <p id="contador-aniversario">
                        ❤️ Calculando próximo mesversario...
                    </p>
                </div>
            </div>
        </header>

        <div class="timeline" id="timeline-container">
            <!--El contenido se inyectara dinamicamente con JS-->>
        </div>

        <!-- Botón centrado al final de la línea de tiempo -->
        <div style="text-align: center; margin: 40px 0; padding-bottom: 50px;">
            <button onclick="mostrarRazon()" class="btn-razones">
                💌 Descubre por qué te amo
            </button>
        </div>

        <!-- Ventana emergente (Modal) oculta por defecto -->
        <div id="modal-razones" class="modal-overlay">
            <div class="modal-contenido">
                <button class="btn-cerrar-modal" onclick="cerrarRazon()"><i class="bi bi-x-lg"></i></button>
                <h3 style="color: #ff4d6d; font-family: 'Pacifico', cursive;">Razones por las que te amo</h3>
                <p id="love-reason" class="razon-texto">...</p>
                <button onclick="mostrarRazon()" class="btn-razones-secundario">✨ Leer otra razón</button>
            </div>
        </div>
    </main>
    
    <audio id="musica-fondo"></audio>

    <button id="btn-musica" onclick="toggleMusica()" aria-label="Controlar música de fondo">
        <img src="img/ArmyBomb.png" alt="Army Bomb" id="icono-army-bomb">
    </button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.2/umd/photoswipe.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.2/umd/photoswipe-lightbox.umd.min.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
